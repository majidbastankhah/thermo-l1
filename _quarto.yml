project:
  type: website
  output-dir: _site
  resources:
    - widgets/
    - pdf/
    - js/katex/

website:
  title: "Thermodynamics (ENGI 1111)"
  description: "Level 1 Thermodynamics, part one — Durham University"
  site-url: "https://majidbastankhah.github.io/thermo-l1/"
  page-navigation: true
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: notes.qmd
        text: "Notes (with gaps)"
      - href: notes-complete.qmd
        text: "Completed notes"
  page-footer:
    center: "Dr Majid Bastankhah · Department of Engineering · Durham University"

format:
  html:
    # Light by default. The sun/moon switch in the navigation bar turns on a
    # dark theme for readers who prefer it; the choice is remembered on that
    # device. The phone's own dark mode does NOT switch it on.
    theme:
      light: cosmo
      dark: darkly
    css: styles.css
    # Click any figure to open it full-screen (helps when reading zoomed in).
    lightbox: auto
    toc: true
    toc-depth: 2
    number-sections: true
    # KaTeX is served from the repository, not a CDN: equations must render
    # even if the lecture-theatre network is slow or blocked.
    html-math-method:
      method: katex
      url: js/katex/
    fig-align: center
    link-external-newwindow: true
    code-copy: false
    include-after-body: js/lecture-reveal.html

filters:
  - filters/gaps.lua
  - filters/boxes.lua
  - filters/difficulty.lua
  - filters/figext.lua
  - filters/wrapfig.lua

# The website is the LECTURE view: gaps start covered and are uncovered one at
# a time in the room. It is also the version posted afterwards, so the screen
# and the posted notes are the same file. build.sh overrides this for print.
gapmode: reveal

# Live, anonymous questions during the lecture (Poll Everywhere Q&A). On the
# notes with gaps this adds an "Ask a question" button, and in presentation
# mode the address and a QR code. Leave qa-url empty to remove all of it.
#   qa-url            the address students go to
#   qa-presenter-url  what the Q key opens for YOU (e.g. your moderation page);
#                     if empty, Q opens qa-url
qa-url: "https://pollev.com/majidbastankhah994"
qa-presenter-url: ""
