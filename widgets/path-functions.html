<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Same end states, different paths</title>
<!-- CH2 "Explore it yourself": a closed system goes from state 1 to state 2
     along different paths. W = -integral of P dV is the area under the path and
     changes from path to path; so does Q; but W + Q = U2 - U1 does not, because
     U is a property. Values: state 1 (4 bar, 1 L), state 2 (1.5 bar, 4 L),
     U2 - U1 = 500 J (air as an ideal gas). Self-contained; one light theme. -->
<style>
  :root {
    color-scheme: light;
    --surface-0: #ffffff; --surface-1: #fcfcfb; --surface-2: #f4f3f0;
    --border: #dedcd6; --text-1: #0b0b0b; --text-2: #52514e; --text-3: #78766f;
    --accent: #68246D; --w: #2a78d6; --q: #eb6834; --u: #68246D;
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; background: var(--surface-0); color: var(--text-1);
         font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 780px; margin: 0 auto; }
  h1 { font-size: 1.05rem; margin: 0 0 2px; letter-spacing: -0.01em; }
  .sub { color: var(--text-2); font-size: 0.86rem; margin: 0 0 14px; }
  .panel { background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px; padding: 12px; }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; align-items: center; }
  .tab { font: inherit; font-size: 0.83rem; cursor: pointer; padding: 5px 12px; border-radius: 999px;
         border: 1px solid var(--border); background: var(--surface-1); color: var(--text-2); }
  .tab[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .hint { font-size: 0.8rem; color: var(--text-3); }
  .grid { display: grid; grid-template-columns: 1fr; gap: 12px; align-items: start; }
  @media (min-width: 640px) { .grid { grid-template-columns: 1.15fr 1fr; } }
  svg { display: block; width: 100%; height: auto; background: var(--surface-0); border-radius: 8px; touch-action: none; }
  .k { font-size: 0.8rem; font-weight: 600; color: var(--text-2); margin: 2px 0 4px; }
  .brow { display: grid; grid-template-columns: 4.6em 1fr 4.8em; align-items: center; gap: 8px; margin: 4px 0; font-size: 0.86rem; }
  .brow .val { text-align: right; font-weight: 650; font-variant-numeric: tabular-nums; }
  .track { position: relative; height: 16px; background: var(--surface-2); border-radius: 4px; }
  .track::after { content: ""; position: absolute; left: 50%; top: -3px; bottom: -3px; width: 1px; background: var(--text-3); }
  .track i { position: absolute; top: 0; bottom: 0; border-radius: 3px; }
  table { border-collapse: collapse; width: 100%; font-size: 0.84rem; margin-top: 10px; font-variant-numeric: tabular-nums; }
  th, td { padding: 3px 6px; text-align: right; border-bottom: 1px solid var(--border); }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--text-2); font-weight: 600; }
  td.u { color: var(--u); font-weight: 700; }
  tr.cur td { background: #f3ecf4; }
  .note { font-size: 0.83rem; color: var(--text-2); margin: 10px 2px 0; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Same end states, different paths</h1>
  <p class="sub">A closed system goes from state 1 to state 2. Change the path and
  compare the work, the heat and the change in internal energy.</p>

  <div class="panel">
    <div class="tabs" role="group" aria-label="Path">
      <button class="tab" data-p="a" aria-pressed="true">Path a</button>
      <button class="tab" data-p="b" aria-pressed="false">Path b</button>
      <button class="tab" data-p="line" aria-pressed="false">Straight line</button>
      <span class="hint" id="hint">or drag the purple dot to make your own path</span>
    </div>
    <div class="grid">
      <svg id="pv" viewBox="0 0 400 330" aria-label="P-V diagram with a draggable path from state 1 to state 2"></svg>
      <div>
        <div class="k">This path</div>
        <div id="bars"></div>
        <table>
          <thead><tr><th>Path</th><th>W (J)</th><th>Q (J)</th><th>W + Q (J)</th></tr></thead>
          <tbody id="tab"></tbody>
        </table>
      </div>
    </div>
    <p class="note" id="note"></p>
  </div>
</div>

<script>
(function () {
  "use strict";
  const $ = id => document.getElementById(id);
  const NS = "http://www.w3.org/2000/svg";
  const fmt = x => (x < -0.5 ? "−" : "") + Math.round(Math.abs(x)).toLocaleString("en-GB");
  const sgn = x => (x > 0.5 ? "+" : "") ;

  // states (V in litres, P in bar); 1 bar L = 100 J
  const S1 = { V: 1, P: 4 }, S2 = { V: 4, P: 1.5 };
  const DU = 500;                                 // U2 - U1, the same for every path
  const PRESET = { a: { V: 3.9, P: 5.2 }, b: { V: 1.1, P: 0.25 }, line: { V: 2.5, P: 2.75 } };
  let ctrl = { ...PRESET.a }, which = "a";

  // plot frame
  const box = { l: 46, r: 14, t: 30, b: 36, W: 400, H: 330 }, Vmax = 5, Pmax = 6;
  const X = V => box.l + V / Vmax * (box.W - box.l - box.r);
  const Y = P => box.H - box.b - P / Pmax * (box.H - box.t - box.b);
  const iX = x => (x - box.l) / (box.W - box.l - box.r) * Vmax;
  const iY = y => (box.H - box.b - y) / (box.H - box.t - box.b) * Pmax;

  // quadratic Bezier from state 1 to state 2 through the control point
  function pt(c, t) {
    const a = (1 - t) * (1 - t), b = 2 * t * (1 - t), d = t * t;
    return { V: a * S1.V + b * c.V + d * S2.V, P: a * S1.P + b * c.P + d * S2.P };
  }
  function work(c) {                              // W = -integral P dV, in J
    let w = 0, p0 = pt(c, 0);
    for (let i = 1; i <= 400; i++) { const p1 = pt(c, i / 400); w -= 0.5 * (p0.P + p1.P) * (p1.V - p0.V); p0 = p1; }
    return w * 100;
  }

  function el(tag, attrs, parent, text) {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (text !== undefined) e.textContent = text;
    if (parent) parent.appendChild(e); return e;
  }

  const svg = $("pv");
  function draw() {
    svg.textContent = "";
    // grid and axes
    for (let P = 0; P <= Pmax; P++) {
      el("line", { x1: box.l, x2: box.W - box.r, y1: Y(P), y2: Y(P), stroke: "#ece9e3" }, svg);
      el("text", { x: box.l - 8, y: Y(P) + 4, "text-anchor": "end", "font-size": 11, fill: "#52514e" }, svg, P);
    }
    for (let V = 0; V <= Vmax; V++) {
      el("line", { y1: box.t, y2: box.H - box.b, x1: X(V), x2: X(V), stroke: "#ece9e3" }, svg);
      el("text", { x: X(V), y: box.H - box.b + 15, "text-anchor": "middle", "font-size": 11, fill: "#52514e" }, svg, V);
    }
    el("path", { d: `M${box.l},${box.t} V${box.H - box.b} H${box.W - box.r}`, fill: "none", stroke: "#52514e", "stroke-width": 1.4 }, svg);
    el("text", { x: box.W - box.r, y: box.H - 4, "text-anchor": "end", "font-size": 12, fill: "#52514e" }, svg, "V (litres)");
    el("text", { x: 8, y: 14, "font-size": 12, fill: "#52514e" }, svg, "P (bar)");

    // other paths, faint, for comparison
    for (const k of ["a", "b", "line"]) if (k !== which) {
      el("path", { d: curve(PRESET[k]), fill: "none", stroke: "#c9c5bd", "stroke-width": 1.5, "stroke-dasharray": "4 4" }, svg);
    }
    // area under the path = |W|
    el("path", { d: curve(ctrl) + ` L${X(S2.V)},${Y(0)} L${X(S1.V)},${Y(0)} Z`, fill: "rgba(42,120,214,0.15)" }, svg);
    // the path, with an arrow in the middle
    el("path", { d: curve(ctrl), fill: "none", stroke: "#2a78d6", "stroke-width": 2.6 }, svg);
    const m0 = pt(ctrl, 0.49), m1 = pt(ctrl, 0.51);
    let ux = X(m1.V) - X(m0.V), uy = Y(m1.P) - Y(m0.P); const L = Math.hypot(ux, uy) || 1; ux /= L; uy /= L;
    const mx = X(pt(ctrl, 0.5).V), my = Y(pt(ctrl, 0.5).P);
    el("path", { d: `M${mx + 6 * ux},${my + 6 * uy} L${mx - 6 * ux - 5 * uy},${my - 6 * uy + 5 * ux} L${mx - 6 * ux + 5 * uy},${my - 6 * uy - 5 * ux} Z`, fill: "#2a78d6" }, svg);
    // guide lines to the control point
    el("path", { d: `M${X(S1.V)},${Y(S1.P)} L${X(ctrl.V)},${Y(ctrl.P)} L${X(S2.V)},${Y(S2.P)}`, fill: "none", stroke: "#68246D", "stroke-width": 1, "stroke-dasharray": "2 4", opacity: 0.6 }, svg);
    // states
    for (const [s, n, dx, dy] of [[S1, "1", -10, -8], [S2, "2", 10, -8]]) {
      el("circle", { cx: X(s.V), cy: Y(s.P), r: 5, fill: "#0b0b0b" }, svg);
      el("text", { x: X(s.V) + dx, y: Y(s.P) + dy, "text-anchor": "middle", "font-size": 14, "font-weight": 700 }, svg, n);
    }
    // label for |W|
    el("text", { x: (X(S1.V) + X(S2.V)) / 2, y: Y(0) - 10, "text-anchor": "middle", "font-size": 12, "font-weight": 600, fill: "#2a78d6" }, svg, "shaded area = |W|");
    // the draggable control point
    const h = el("circle", { cx: X(ctrl.V), cy: Y(ctrl.P), r: 9, fill: "#68246D", stroke: "#fff", "stroke-width": 2.5, style: "cursor:grab", tabindex: 0, "aria-label": "Drag to change the path" }, svg);
    h.addEventListener("pointerdown", startDrag);
  }
  function curve(c) {
    return `M${X(S1.V)},${Y(S1.P)} Q${X(c.V)},${Y(c.P)} ${X(S2.V)},${Y(S2.P)}`;
  }

  // ------------------------------------------------------------ dragging --
  let dragging = false;
  function toSvg(e) {
    const r = svg.getBoundingClientRect();
    return { x: (e.clientX - r.left) / r.width * box.W, y: (e.clientY - r.top) / r.height * box.H };
  }
  function startDrag(e) { dragging = true; svg.setPointerCapture(e.pointerId); e.preventDefault(); }
  svg.addEventListener("pointermove", e => {
    if (!dragging) return;
    const p = toSvg(e);
    ctrl = { V: Math.min(Vmax - 0.05, Math.max(0.05, iX(p.x))), P: Math.min(Pmax - 0.05, Math.max(0.05, iY(p.y))) };
    which = "own"; setTabs(); update();
  });
  svg.addEventListener("pointerup", () => { dragging = false; });
  svg.addEventListener("pointercancel", () => { dragging = false; });

  // ------------------------------------------------------------- update --
  function bars(W, Q) {
    const rows = [["W", W, "#2a78d6"], ["Q", Q, "#eb6834"], ["U₂ − U₁", DU, "#68246D"]];
    const scale = 2600;
    $("bars").innerHTML = rows.map(([n, v, c]) => {
      const f = Math.min(50, Math.abs(v) / scale * 50), left = v >= 0 ? 50 : 50 - f;
      return "<div class='brow'><span>" + n + "</span><span class='track'><i style='left:" + left + "%;width:" + f +
        "%;background:" + c + "'></i></span><span class='val'>" + fmt(v) + " J</span></div>";
    }).join("");
  }
  function update() {
    const W = work(ctrl), Q = DU - W;
    bars(W, Q);
    const rows = [["a", "Path a"], ["b", "Path b"], ["line", "Straight line"]];
    if (which === "own") rows.push(["own", "Your path"]);
    $("tab").innerHTML = rows.map(([k, name]) => {
      const w = k === "own" ? W : work(PRESET[k]);
      return "<tr" + (k === which ? " class='cur'" : "") + "><td>" + name + "</td><td>" + fmt(w) + "</td><td>" +
        fmt(DU - w) + "</td><td class='u'>" + fmt(DU) + "</td></tr>";
    }).join("");
    $("note").innerHTML = W > 0
      ? "Here the path goes back to smaller volumes for part of the way, and overall the surroundings do work on the gas (W > 0). Still, W + Q = U₂ − U₁."
      : "W and Q change from path to path: they are <b>path functions</b>. Their sum does not: W + Q = U₂ − U₁ = " + DU +
        " J on every path, because U is a <b>property</b> and depends only on the end states.";
    draw();
    postHeight();
  }
  function setTabs() {
    document.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-pressed", b.dataset.p === which ? "true" : "false"));
  }
  document.querySelectorAll(".tab").forEach(b => b.addEventListener("click", () => {
    which = b.dataset.p; ctrl = { ...PRESET[which] }; setTabs(); update();
  }));

  function postHeight() {
    try { parent.postMessage({ widgetHeight: document.querySelector(".wrap").offsetHeight + 34 }, "*"); } catch (e) {}
  }
  window.addEventListener("load", postHeight);
  window.addEventListener("resize", postHeight);
  update();
})();
</script>
</body>
</html>
