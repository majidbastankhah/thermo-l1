<script>
/* ---------------------------------------------------------------------------
   Lecture reveal.

   Every ::: {.gap} on the page starts covered. Space (or the arrow keys, a
   clicker, or a click on the panel itself) uncovers them in document order and
   scrolls the new one into view. "P" strips the site furniture and enlarges the
   type for projection.

   The point of doing it this way: the page on the screen in the room and the
   page posted afterwards are the same file, so the completed notes can never
   disagree with what the class actually saw.
--------------------------------------------------------------------------- */
(function () {
  "use strict";

  // End-of-chapter solutions (.gap-solo) are not lecture steps: each opens by
  // itself when clicked, and the keys and the counter leave them alone,
  // so opening P5's solution does not also give away P1-P4.
  Array.prototype.forEach.call(document.querySelectorAll(".gap-solo"), function (g) {
    g.setAttribute("role", "button");
    g.setAttribute("tabindex", "0");
    g.setAttribute("aria-expanded", "false");
    g.setAttribute("aria-label", "Show solution");
    function open(ev) {
      if (g.classList.contains("is-open")) return;
      ev.preventDefault();
      g.classList.add("is-open");
      g.removeAttribute("role"); g.removeAttribute("tabindex");
      g.removeAttribute("aria-label"); g.setAttribute("aria-expanded", "true");
    }
    g.addEventListener("click", open);
    g.addEventListener("keydown", function (ev) {
      if (ev.key === "Enter" || ev.key === " ") open(ev);
    });
  });

  const gaps = Array.prototype.slice.call(document.querySelectorAll(".gap-reveal:not(.gap-solo)"));
  if (!gaps.length) return;

  let cursor = 0;                       // how many are uncovered

  // ------------------------------------------------------------------ bar --
  const bar = document.createElement("div");
  bar.className = "reveal-bar";
  bar.innerHTML =
    '<button type="button" data-act="back" title="Cover the last one (left arrow)">&larr;</button>' +
    '<span class="count"></span>' +
    '<button type="button" data-act="next" title="Reveal the next one (space)">Reveal &rarr;</button>' +
    '<button type="button" data-act="none" title="Cover everything (H)">Reset</button>' +
    '<button type="button" data-act="present" title="Presentation mode (P)">Present</button>' +
    '<span class="hintkey">space &middot; P</span>';
  document.body.appendChild(bar);

  const count = bar.querySelector(".count");

  // ---------------------------------------------------------------- state --
  function paint(scrollTo) {
    gaps.forEach(function (g, i) {
      g.classList.toggle("is-open", i < cursor);
      g.classList.toggle("is-next", i === cursor);
      if (i >= cursor) {
        g.setAttribute("role", "button");
        g.setAttribute("tabindex", "0");
        g.setAttribute("aria-expanded", "false");
        g.setAttribute("aria-label", "Reveal step " + (i + 1) + " of " + gaps.length);
      } else {
        g.removeAttribute("role");
        g.removeAttribute("tabindex");
        g.setAttribute("aria-expanded", "true");
        g.removeAttribute("aria-label");
      }
    });
    count.textContent = cursor + " / " + gaps.length;

    if (scrollTo != null && gaps[scrollTo]) {
      gaps[scrollTo].scrollIntoView({
        behavior: window.matchMedia("(prefers-reduced-motion: reduce)").matches
          ? "auto" : "smooth",
        block: "center"
      });
    }
    try { localStorage.setItem("reveal:" + location.pathname, String(cursor)); } catch (e) {}
  }

  function next() { if (cursor < gaps.length) { cursor++; paint(cursor - 1); } }
  function back() { if (cursor > 0) { cursor--; paint(cursor); } }
  function none() { cursor = 0; paint(null); window.scrollTo({ top: 0, behavior: "smooth" }); }

  function present() {
    document.body.classList.toggle("present");
    const on = document.body.classList.contains("present");
    bar.querySelector('[data-act="present"]').textContent = on ? "Exit" : "Present";
  }

  // --------------------------------------------------------------- events --
  bar.addEventListener("click", function (ev) {
    const act = ev.target.getAttribute("data-act");
    if (act === "next") next();
    else if (act === "back") back();
    else if (act === "none") none();
    else if (act === "present") present();
  });

  // clicking a covered panel jumps straight to it -- useful when a student
  // asks about something three steps back
  gaps.forEach(function (g, i) {
    function open(ev) {
      if (g.classList.contains("is-open")) return;
      ev.preventDefault();
      cursor = i + 1;
      paint(i);
    }
    g.addEventListener("click", open);
    g.addEventListener("keydown", function (ev) {
      if (ev.key === "Enter" || ev.key === " ") open(ev);
    });
  });

  document.addEventListener("keydown", function (ev) {
    const t = ev.target;
    if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable)) return;
    if (ev.metaKey || ev.ctrlKey || ev.altKey) return;
    if (t && t.closest && t.closest(".gap-reveal")) return;   // handled above

    switch (ev.key) {
      case " ": case "ArrowRight": case "ArrowDown": case "PageDown":
        ev.preventDefault(); next(); break;
      case "ArrowLeft": case "ArrowUp": case "PageUp":
        ev.preventDefault(); back(); break;
      case "h": case "H": none(); break;
      case "p": case "P": present(); break;
      default: break;
    }
  });

  // A student opening this afterwards picks up where they left off. There is
  // deliberately no "uncover everything" here: that is what the completed
  // notes are for.
  try {
    const saved = parseInt(localStorage.getItem("reveal:" + location.pathname), 10);
    if (!isNaN(saved)) cursor = Math.max(0, Math.min(gaps.length, saved));
  } catch (e) {}
  paint(null);
})();
</script>

<!-- Live questions during the lecture (Poll Everywhere Q&A, address set by
     qa-url in _quarto.yml). Only on pages that carry #qa-config, i.e. the
     notes with gaps.
       button  "Ask a question": opens the Q&A in a new tab
       Q       you: opens qa-presenter-url (or qa-url) in a small window at the
               side of the screen; Q again brings that same window to the front
       J       a large QR code + address, to show at the start of a lecture
       Esc     close the QR card
     Poll Everywhere cannot run inside another page (its bot check fails in an
     embedded frame: "Max challenge attempts exceeded"), so it always gets a
     tab or window of its own.
     In presentation mode (P) the address and a small QR stay in a corner. -->
<script src="js/qrcode.js"></script>
<script>
(function () {
  "use strict";
  const cfg = document.getElementById("qa-config");
  if (!cfg || !cfg.dataset.url) return;
  const url = cfg.dataset.url;
  const presenter = cfg.dataset.presenter || url;
  const shown = url.replace(/^https?:\/\/(www\.)?/, "").replace(/\/$/, "");

  function qrSvg() {
    try {
      const qr = qrcode(0, "M"); qr.addData(url); qr.make();
      return qr.createSvgTag({ cellSize: 4, margin: 2, scalable: true });
    } catch (e) { return ""; }
  }
  const qr = qrSvg();

  // ----------------------------------------------- student button: a tab --
  const btn = document.createElement("a");
  btn.className = "qa-button";
  btn.href = url;
  btn.target = "_blank";
  btn.rel = "noopener";
  btn.innerHTML = "Ask a question <span>anonymous</span>";
  btn.title = "Ask a question anonymously (" + shown + "), opens in a new tab";
  document.body.appendChild(btn);

  // -------------------------------- lecturer (Q): one window at the side --
  let side = null;
  function openSide() {
    if (side && !side.closed) { side.focus(); return; }
    const w = 460, h = Math.max(500, (screen.availHeight || 900) - 40);
    const left = Math.max(0, (screen.availWidth || 1400) - w);
    side = window.open(presenter, "qa-presenter",
      "popup,width=" + w + ",height=" + h + ",left=" + left + ",top=0");
    if (!side) window.open(presenter, "_blank");   // popup blocked: a tab
  }

  // ------------------------------- presentation mode: badge + join card --
  const badge = document.createElement("div");
  badge.className = "qa-badge";
  badge.innerHTML = qr + '<div><strong>Questions?</strong><br>' + shown +
                    '<br><small>anonymous</small></div>';
  document.body.appendChild(badge);

  const card = document.createElement("div");
  card.className = "qa-card";
  card.innerHTML = '<div class="qa-card-inner">' + qr +
    '<p class="qa-card-title">Ask a question, anonymously</p>' +
    '<p class="qa-card-url">' + shown + '</p>' +
    '<p class="qa-card-hint">press J to close</p></div>';
  document.body.appendChild(card);
  card.addEventListener("click", function () { document.body.classList.remove("qa-join"); });

  document.addEventListener("keydown", function (ev) {
    const t = ev.target;
    if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable)) return;
    if (ev.metaKey || ev.ctrlKey || ev.altKey) return;
    if (ev.key === "q" || ev.key === "Q") { ev.preventDefault(); openSide(); }
    else if (ev.key === "j" || ev.key === "J") { document.body.classList.toggle("qa-join"); }
    else if (ev.key === "Escape") { document.body.classList.remove("qa-join"); }
  });
})();
</script>
